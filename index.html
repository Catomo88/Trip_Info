*{box-sizing:border-box;margin:0;padding:0}

.err{color:#c2410c;font-size:14px;font-weight:600;min-height:20px;margin-top:10px}
</style></head><body>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...a));
const LK='tk_'+P.id;
async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim()),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},km,256));}
async function dec(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},k,ub(P.c)));}
function show(h){try{document.activeElement&&document.activeElement.blur()}catch(e){}document.open();document.write(h);document.close();setTimeout(()=>window.scrollTo(0,0),0);}
function save(raw){try{localStorage.setItem(LK,P.s+'.'+bu(raw))}catch(e){}}
const ready=()=>document.readyState==='complete'?Promise.resolve():new Promise(r=>addEventListener('load',()=>setTimeout(r,0),{once:true}));
async function tryRaw(raw,remember){let h;try{h=await dec(raw)}catch(e){return false}if(remember)save(raw);await ready();show(h);return true}
(async()=>{
  const m=location.hash.match(/[#&]k=([^&]+)/);
  if(m){const pw=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname+location.search);
    if(await tryRaw(await derive(pw),true))return;}
  try{const v=localStorage.getItem(LK);if(v){const [s,k]=v.split('.');if(s===P.s&&await tryRaw(ub(k),false))return;localStorage.removeItem(LK);}}catch(e){}
  const f=document.getElementById('f');f.style.visibility='visible';const pi=document.getElementById('pw');pi.focus();pi.oninput=()=>{pi.value=pi.value.replace(/\D/g,'').slice(0,4);if(pi.value.length===4)f.requestSubmit();};
  f.onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('err');e.textContent='확인 중…';
    const raw=await derive(document.getElementById('pw').value);
    if(!await tryRaw(raw,document.getElementById('rm').checked)){e.textContent='번호가 맞지 않아요';document.getElementById('pw').value='';document.getElementById('pw').focus();}};
})();
