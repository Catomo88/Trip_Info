<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>가족 여행</title>
<style>
:root{--ink:#1c2333;--sub:#4b5565;--mute:#64748b;--bg:#f5f6f8;--line:#e5e8ee;--navy:#1b2a4a;--red:#c2410c;--green:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;word-break:keep-all}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 50px}
header{padding:10px 4px 18px}
header .hi{font-size:14px;color:var(--mute);font-weight:600}
header h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;font-weight:800;color:var(--mute);letter-spacing:.04em;margin:26px 4px 10px}

/* next trip hero card */
.next{display:block;text-decoration:none;color:#fff;border-radius:20px;overflow:hidden;position:relative;min-height:230px;background:#1b2a4a center/cover;box-shadow:0 8px 24px rgba(27,42,74,.18)}
.next::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.05),rgba(15,23,42,.85))}
.next .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:18px}
.next .dd{display:inline-block;background:#fff;color:var(--navy);font-weight:800;font-size:15px;border-radius:99px;padding:3px 12px;margin-bottom:8px}
.next h3{font-size:26px;font-weight:800;line-height:1.2}
.next .m{font-size:15px;opacity:.92;margin-top:4px}
.next .go{position:absolute;right:16px;top:16px;z-index:1;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}

/* list rows */
.list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:13px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line);min-height:72px}
.row:first-child{border-top:0}
.row .th{width:56px;height:56px;border-radius:12px;background:#dfe3ea center/cover;display:flex;align-items:center;justify-content:center;font-size:26px}
.row b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.row .m{font-size:14px;color:var(--mute)}
.row .r{font-size:13px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap}
.r.up{background:#fff1ea;color:var(--red)} .r.done{background:#eef0f4;color:var(--mute)} .r.memo{background:#e8f6ec;color:var(--green)}
.row:active{background:#f7f8fa}

details{background:#fff;border-radius:16px;margin-top:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
summary{list-style:none;cursor:pointer;padding:16px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--mute);font-weight:400}
details[open] summary::after{content:"－"}
.pf{padding:0 16px 14px}
.pf div{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.pf b{display:block;font-size:13px;color:var(--mute)}
.fam{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px}
.fam span{background:#f1f3f6;border-radius:99px;padding:4px 11px;font-size:14px}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:28px}
footer button{font:inherit;font-size:13px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hi">가족 여행 아카이브</div>
  <h1>🌍 우리 가족 여행</h1>
</header>

<div id="nextBox"></div>

<h2 id="upH">다가오는 여행</h2>
<div class="list" id="up"></div>

<h2>지난 여행</h2>
<div class="list" id="past"></div>

<h2>메모</h2>
<div class="list">
  <a class="row" href="#" onclick="return false">
    <div class="th">🏯</div>
    <div><b>후쿠오카 · 힐튼 씨호크</b><div class="m">자주 이용 · 파노라믹 와시츠 스위트, 602호 좋음 / 611호 조건부</div></div>
    <span class="r memo">기준점</span>
  </a>
  <a class="row" href="#" onclick="return false">
    <div class="th">🏨</div>
    <div><b>오사카 · 힐튼 오사카</b><div class="m">위치·서비스 우수, 사우나·대욕장 약함</div></div>
    <span class="r memo">기준점</span>
  </a>
</div>



<footer>
  <div>페이지마다 비밀번호로 잠겨 있습니다</div>
  <button onclick="lockAll()">🔒 이 기기에서 모두 잠그기</button>
</footer>
</div>

<script>
const TRIPS=[
 {k:'kagoshima',href:'./kagoshima/',name:'가고시마',sub:'3가족 12명 · 쉐라톤 + KAI 기리시마',start:'2026-12-24',end:'2026-12-27',emoji:'🌋',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Sakurajima-2.jpg?width=900'},
 {k:'cinqueterre',href:'./cinqueterre/',name:'친퀘테레',sub:'부모님 · 리오마조레 Sunset Line',start:'2026-09-25',end:'2026-09-27',emoji:'🌊',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Riomaggiore_From_Ferry_Cinque_Terre_Italy_Sep23_A7C_07414.jpg?width=300'},
 {k:'rome',href:'./rome/',name:'로마',sub:'6인 · 멜리니 · 아시시 · 카발리에리',start:'2026-09-18',end:'2026-09-25',emoji:'🇮🇹',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Colosseum_in_Rome,_Italy_-_April_2007.jpg?width=300'},
 {k:'osaka',href:'./osaka/',name:'오사카',sub:'OYIS 캠프 · 인터컨티넨탈',start:'2026-08-01',end:'2026-08-10',emoji:'🇯🇵',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Osaka_Castle_02bs3200.jpg?width=300'}
];
const today=new Date();today.setHours(0,0,0,0);
const d=s=>{const x=new Date(s+'T00:00:00');return x};
const fmt=s=>s.slice(5).replace('-','.');
const up=TRIPS.filter(t=>d(t.end)>=today).sort((a,b)=>d(a.start)-d(b.start));
const past=TRIPS.filter(t=>d(t.end)<today).sort((a,b)=>d(b.start)-d(a.start));
function dday(t){const n=Math.round((d(t.start)-today)/864e5);return n>0?'D-'+n:(n===0?'D-DAY':'여행 중')}
function row(t,isUp){
  const th=t.img?`style="background-image:url('${t.img}')"`:'';
  return `<a class="row" href="${t.href}"><div class="th" ${th}>${t.img?'':t.emoji}</div>
  <div><b>${t.name}</b><div class="m">${t.start.slice(0,4)}.${fmt(t.start)} – ${fmt(t.end)} · ${t.sub}</div></div>
  <span class="r ${isUp?'up':'done'}">${isUp?dday(t):'완료'}</span></a>`;
}
if(up.length){
  const n=up[0];
  document.getElementById('nextBox').innerHTML=`<a class="next" href="${n.href}" style="background-image:url('${n.img}')">
   <span class="go">열기 →</span><div class="in"><span class="dd">${dday(n)}</span>
   <h3>${n.emoji} ${n.name}</h3><div class="m">${n.start.slice(0,4)}.${fmt(n.start)} – ${fmt(n.end)} · ${n.sub}</div></div></a>`;
}
const rest=up.slice(1);
document.getElementById('up').innerHTML=rest.map(t=>row(t,true)).join('');
if(!rest.length){document.getElementById('upH').style.display='none';document.getElementById('up').style.display='none';}
document.getElementById('past').innerHTML=past.map(t=>row(t,false)).join('');
function lockAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('tk_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
</script>
</body>
</html>
